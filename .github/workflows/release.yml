name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  # Jade parses with tree-sitter, whose Go binding is cgo, not pure Go — so
  # there is no cross-compiling without arranging a C toolchain per target.
  # Building each target on its own native runner is the cheaper trade: no
  # cross-toolchain to maintain, and each binary is built by the platform it
  # will run on.
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          # macos-13 was retired on 2025-12-04 and its label no longer
          # resolves to anything — a job asking for it queues forever rather
          # than failing, which is how this cost three hours before anyone
          # looked at the label itself. macos-15-intel is the supported x64
          # runner; macos-14 is Apple Silicon.
          - runner: macos-15-intel
            os: darwin
            arch: amd64
          - runner: macos-14
            os: darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build
        run: |
          set -e
          name="jade-mcp_${GITHUB_REF_NAME}_${{ matrix.os }}_${{ matrix.arch }}"
          mkdir -p dist
          CGO_ENABLED=1 go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "dist/${name}" ./cmd/jade-mcp
          "dist/${name}" --version
          ( cd dist && tar czf "${name}.tar.gz" "${name}" && rm "${name}" )

      - uses: actions/upload-artifact@v4
        with:
          name: jade-mcp_${{ matrix.os }}_${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      # The release notes live in the repository. Without a checkout the notes
      # step cannot see them and fails every tag — which is how v0.0.3's
      # publish job failed and had to be released by hand.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Checksums are computed once, over everything, after all four
      # architectures have landed — a per-runner checksum file would give four
      # partial lists rather than one manifest.
      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      # Hand-written notes lead the release; GitHub's generated commit list is
      # appended below them. A tag with no notes file fails here rather than
      # publishing a release whose only description is a list of commit titles.
      - name: Release notes
        run: |
          notes="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes" ]; then
            echo "missing $notes — write release notes before tagging" >&2
            exit 1
          fi
          if grep -q '^## Draft status' "$notes"; then
            echo "$notes still has its Draft status section — finish the notes before tagging" >&2
            exit 1
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: docs/release-notes/${{ github.ref_name }}.md
          generate_release_notes: true

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Published so other projects can pull the binary into their own image
      # with a single COPY --from, without a Go toolchain in their build.
      # linux/arm64 is compiled under emulation here, which is slow but avoids
      # a second runner just for the image.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/jade-mcp:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/jade-mcp:latest

  # The registry listing points at the image, and the registry checks the
  # image's server-name label before accepting it, so this waits for the push.
  # server.json keeps a committed version for local validation; the tag
  # overrides it here, so a release never needs a manual bump. GitHub OIDC
  # proves the io.github.julianbei namespace without a stored secret.
  registry:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq --arg v "$version" --arg image "ghcr.io/${{ github.repository_owner }}/jade-mcp:${GITHUB_REF_NAME}" \
            '.version = $v | .packages[0].identifier = $image' server.json > server.tmp
          mv server.tmp server.json
          cat server.json

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher

      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
