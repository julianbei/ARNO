name: "Bug — a tool did the wrong thing"
description: A Arno tool returned a wrong answer, failed when it should not have, or changed something it should not have.
title: "bug: "
labels: ["bug"]
body:
  - type: checkboxes
    id: reconnect
    attributes:
      label: Reconnect check
      description: |
        Please confirm this first — it is by far the most common false alarm.

        The MCP tool catalog is fixed at connection time. A new binary is not
        used, and a changed tool list does not appear, until the client
        reconnects (`/mcp` in Claude Code) or restarts.
      options:
        - label: I reconnected my MCP client (or restarted it) and the problem persists.
          required: true

  - type: textarea
    id: call
    attributes:
      label: The call
      description: Tool name and arguments. Shorten or redact code if you need to.
      render: json
      placeholder: |
        {"name": "arno.rename", "arguments": {"path": "src/main/java/app/Order.java", "symbolName": "total", "newName": "grandTotal"}}
    validations:
      required: true

  - type: textarea
    id: response
    attributes:
      label: What came back
      description: Paste the response verbatim. Arno's responses are plain text and usually short.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: dropdown
    id: language
    attributes:
      label: Language of the file involved
      options:
        - Java
        - Scala
        - Go
        - Kotlin (text search only)
        - TypeScript / JavaScript
        - Python
        - Rust
        - Ruby
        - Other (text search only)
        - Not language-specific
    validations:
      required: true

  - type: textarea
    id: capabilities
    attributes:
      label: Capabilities (very helpful for language problems)
      description: |
        Output of the `arno.capabilities` tool: which grammar and language
        server Arno used, and the build and test commands it found. No source
        code in it.
      render: text

  - type: textarea
    id: telemetry
    attributes:
      label: Telemetry (optional)
      description: |
        Output of the `arno.telemetry` tool. It records **no arguments, no
        response bodies and no error text** — only tool names, sizes, timings
        and failure classes — so it is safe to paste from a private repo.
      render: text

  - type: dropdown
    id: host
    attributes:
      label: Agent host
      options:
        - Claude Code
        - Codex CLI
        - OpenCode
        - goose
        - Cline
        - Gemini CLI
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `arno-mcp --version`.
      placeholder: arno-mcp v0.0.8
    validations:
      required: true
