name: "Feature wish — Arno should be able to do this"
description: Something you wish Arno did, or did in a different shape — a tool, a language, a build tool, a host.
title: "wish: "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Wishes are welcome, small or large. Two things make one easy to act on:
        the **task** behind it, and **how often** it comes up.

        If Arno already has a tool for it that did not work for you, a
        **friction** or **bug** report fits better. The README's
        "What Arno does not do yet" section lists known gaps — a wish that
        one of them bit you in real work still tells us its priority.

        **Wishing for Windows?** Please give
        [issue #2](https://github.com/julianbei/arno/issues/2) a 👍 instead —
        that's where we count.

  - type: dropdown
    id: area
    attributes:
      label: What kind of wish?
      options:
        - A new tool or a new capability of a tool
        - Better support for a language (Java, Scala, Kotlin, …)
        - Build tool or test runner support (Maven, Gradle, sbt, …)
        - Another agent host or editor
        - Output shape, speed or size of responses
        - Setup, docs or configuration
        - Something else
    validations:
      required: true

  - type: textarea
    id: task
    attributes:
      label: What were you trying to do?
      description: |
        The task, not the feature. "I wanted every implementation of an
        interface across Gradle modules before changing its signature" tells us
        more than "add a find-implementations tool" — and lets us check whether
        an existing tool should have covered it.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: IDE, shell command, reading by hand, another tool, or "I gave up".
    validations:
      required: true

  - type: textarea
    id: shape
    attributes:
      label: What would a good answer look like?
      description: Optional. Arno's responses are plain text that lead with the decisive line.
      render: text

  - type: dropdown
    id: languages
    attributes:
      label: Languages this is about
      multiple: true
      options:
        - Java
        - Scala
        - Go
        - Kotlin
        - TypeScript / JavaScript
        - Python
        - Rust
        - Ruby
        - Other
        - Not language-specific

  - type: dropdown
    id: frequency
    attributes:
      label: How often does this come up?
      options:
        - Several times a session
        - Most sessions
        - Occasionally
        - Once, but it blocked me completely
    validations:
      required: true
