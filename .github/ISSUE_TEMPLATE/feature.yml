name: "Feature — jade should be able to do this"
description: A capability jade does not have, or has in a shape that does not fit.
title: "feature: "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Before writing: [docs/tool-contract.md](https://github.com/julianbei/jade/blob/main/docs/tool-contract.md)
        lists the frozen 0.0.1 surface, and the README has a
        "What Jade does not do yet" section. If what you want is already listed
        as a known limitation, a **friction** report saying it bit you in real
        work is worth more than a feature request — it tells us the priority.

  - type: textarea
    id: task
    attributes:
      label: What were you actually trying to do?
      description: |
        The task, not the feature. "I wanted to find every caller of a struct
        field before deleting it" tells us more than "add a field-usage tool" —
        it lets us check whether an existing tool should have covered it.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: Shell command, manual reading, another tool, or "I gave up".
    validations:
      required: true

  - type: textarea
    id: shape
    attributes:
      label: What shape would the answer take?
      description: |
        Optional, but useful. Jade's responses are plain text and lead with the
        decisive line. What would a good response to this look like?
      render: text

  - type: dropdown
    id: frequency
    attributes:
      label: How often does this come up?
      options:
        - Several times a session
        - Most sessions
        - Occasionally
        - Once, but it blocked me completely
    validations:
      required: true
